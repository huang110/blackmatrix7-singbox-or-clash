name: Compile ALL Rules (Sing-box SRS & Clash YAML)

on:
  schedule:
    - cron: '0 22 * * *' 
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Setup sing-box
        run: |
          bash <(curl -fsSL https://sing-box.app/deb-install.sh)
          sing-box version

      - name: Process and Compile All Rules
        run: |
          mkdir -p publish/clash
          mkdir -p publish/sing-box
          
          # 1. 克隆黑矩阵源码仓库
          git clone --depth 1 https://github.com/blackmatrix7/ios_rule_script.git upstream
          
          # 2. 注入 Python 脚本，引入 shutil 实现无损复制
          cat << 'EOF' > convert.py
          import yaml, json, os, glob, shutil

          files = glob.glob('upstream/rule/Clash/**/*.yaml', recursive=True)
          for file in files:
              try:
                  with open(file, 'r', encoding='utf-8') as f:
                      data = yaml.safe_load(f)
                  if not data or 'payload' not in data: 
                      continue
                      
                  rules = {'domain_suffix':[], 'domain_keyword':[], 'domain':[], 'ip_cidr':[], 'process_name':[]}
                  for line in data['payload']:
                      if not isinstance(line, str): continue
                      line = line.split('#')[0].strip()
                      if not line: continue
                      
                      parts = line.split(',')
                      if len(parts) < 2: continue
                      
                      t, v = parts[0].strip().upper(), parts[1].strip()
                      
                      if t == 'DOMAIN-SUFFIX': rules['domain_suffix'].append(v)
                      elif t == 'DOMAIN-KEYWORD': rules['domain_keyword'].append(v)
                      elif t == 'DOMAIN': rules['domain'].append(v)
                      elif t in ['IP-CIDR', 'IP-CIDR6']: rules['ip_cidr'].append(v)
                      elif t == 'PROCESS-NAME': rules['process_name'].append(v)
                      
                  rules = {k:v for k,v in rules.items() if v}
                  if not rules: continue
                  
                  # 组装 sing-box JSON 格式
                  out = {'version': 1, 'rules': [rules]}
                  
                  filename = os.path.basename(file)
                  name = filename.replace('.yaml', '')
                  
                  # 导出 JSON 准备编译
                  with open(f"publish/sing-box/{name}.json", 'w', encoding='utf-8') as f:
                      json.dump(out, f)
                      
                  # 使用 shutil.copy 安全无损地复制原生 YAML 文件
                  shutil.copy(file, f"publish/clash/{filename}")
                  
              except Exception as e:
                  print(f"解析出错 {file}: {e}")
          EOF
          
          # 3. 运行批量转化
          echo ">>> 正在将 Clash 规则全量翻译为 Sing-box 格式..."
          python convert.py
          
          # 4. 批量编译所有 JSON 为 SRS
          echo ">>> 正在批量编译 .srs 二进制文件..."
          cd publish/sing-box
          for file in *.json; do
            sing-box rule-set compile "$file" -o "${file%.json}.srs" || true
            rm "$file" 
          done
          cd ../..
          
          # 清理工作区
          rm -rf upstream convert.py

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compile ALL rules perfectly"
          file_pattern: publish
