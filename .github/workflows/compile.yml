name: Sync Rules (Clash YAML & Sing-box SRS)

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Rules from Upstreams
        run: |
          mkdir -p publish/sing-box
          mkdir -p publish/clash
          
          # ==========================================
          # 1. 获取 Sing-box 的 SRS 二进制文件
          # 我们直接拉取 DustinWin 每日自动编译并清洗好的现成 SRS 文件
          # ==========================================
          echo ">>> 正在拉取 Sing-box (.srs) 二进制规则..."
          curl -sSL "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box/srs-proxy.srs" -o publish/sing-box/GlobalMedia.srs
          curl -sSL "https://raw.githubusercontent.com/DustinWin/ruleset_geodata/sing-box/srs-direct.srs" -o publish/sing-box/ChinaMedia.srs
          
          # ==========================================
          # 2. 获取 Clash / Mihomo 的 YAML 文本文件
          # 注意：因为黑矩阵规则是 classical 混合规则，无法转为 mrs
          # 直接拉取 yaml 在 Mihomo 中以 classical 模式运行即可，内存占用依然极小
          # ==========================================
          echo ">>> 正在拉取 Clash (.yaml) 规则..."
          curl -sSL "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.yaml" -o publish/clash/GlobalMedia.yaml
          curl -sSL "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.yaml" -o publish/clash/ChinaMedia.yaml

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync updated rules"
          file_pattern: publish
